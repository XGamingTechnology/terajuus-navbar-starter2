name: Deploy ke VPS

on:
  push:
    branches:
      - versibaru   # otomatis jalan kalau push ke branch ini

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy ke VPS
        run: |
          echo ">>> Connect ke VPS dan mulai deploy..."
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'EOF'
            set -e
            echo ">>> Masuk ke direktori project"
            cd ~/terajuus-navbar-starter2

            echo ">>> Load environment (agar npm dikenali)"
            if [ -f "$HOME/.bashrc" ]; then
              source $HOME/.bashrc
            fi

            # kalau pakai nvm
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo ">>> Update branch"
            git fetch origin versibaru
            git reset --hard origin/versibaru

            echo ">>> Install dependencies & build"
            npm install
            npm run build

            echo ">>> Deploy ke nginx directory"
            sudo rm -rf /var/www/tus-com/*
            sudo cp -r dist/* /var/www/tus-com/

            echo ">>> Reload nginx"
            sudo systemctl reload nginx
          EOF

      - name: Purge Cloudflare Cache
        run: |
          echo ">>> Purge cache Cloudflare"
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ vars.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ vars.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
