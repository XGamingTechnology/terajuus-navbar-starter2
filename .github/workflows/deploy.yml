name: Deploy ke VPS

on:
  push:
    branches:
      - versibaru   # otomatis jalan kalau push ke branch ini

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy ke VPS
        run: |
          echo ">>> Connect ke VPS dan mulai deploy..."
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'EOF'
            set -e  # Exit immediately if a command exits with a non-zero status

            PROJECT_DIR="$HOME/terajuus-navbar-starter2"
            NGINX_ROOT="/var/www/tus-com"

            echo ">>> Masuk ke direktori project"
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "ERROR: Direktori proyek tidak ditemukan: $PROJECT_DIR"
              exit 1
            fi
            cd "$PROJECT_DIR"

            echo ">>> Load environment (agar npm/nvm dikenali)"
            if [ -f "$HOME/.bashrc" ]; then
              source "$HOME/.bashrc"
            fi

            # Load nvm jika digunakan
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo ">>> Update branch versibaru"
            git fetch origin versibaru
            git reset --hard origin/versibaru

            echo ">>> Install dependencies & build"
            npm ci --prefer-offline  # lebih cepat & konsisten daripada npm install
            npm run build

            # Pastikan folder dist ada
            if [ ! -d "dist" ]; then
              echo "ERROR: Folder 'dist' tidak ditemukan setelah build!"
              exit 1
            fi

            echo ">>> Deploy ke direktori nginx"
            sudo rm -rf "${NGINX_ROOT:?}/*"
            sudo cp -r dist/* "$NGINX_ROOT/"

            echo ">>> Reload nginx"
            sudo systemctl reload nginx

            echo "✅ Deploy selesai!"
          EOF

      - name: Purge Cloudflare Cache
        run: |
          echo ">>> Purge cache Cloudflare"
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ vars.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ vars.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
