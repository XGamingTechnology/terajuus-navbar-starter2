name: Deploy ke VPS

on:
  push:
    branches:
      - versibaru   # otomatis jalan kalau push ke branch ini

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.TERAJU }}

      - name: Deploy ke VPS
        run: |
          ssh -o StrictHostKeyChecking=no root@IP_VPS 'bash -s' << 'EOF'
            cd ~/terajuus-navbar-starter2
            git fetch origin versibaru
            git reset --hard origin/versibaru
            npm install
            npm run build
            rm -rf /var/www/tus-com/*
            cp -r dist/* /var/www/tus-com/
            systemctl reload nginx
          EOF
